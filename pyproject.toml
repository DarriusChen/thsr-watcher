[project]
name = "thsr-watcher"
version = "0.1.0"
description = "A personal-use THSR ticket availability watcher"
readme = "README.md"
authors = [
    { name = "DarriusChen", email = "darriuschen0926@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
thsr-watcher = "thsr_watcher.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
